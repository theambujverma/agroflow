<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AgroFlow</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .checkout-layout{ display:grid; grid-template-columns:1.6fr 1fr; gap:40px; align-items:start; }
  .pay-options{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0 26px; }
  .pay-option{ border:1px solid var(--line); border-radius:var(--radius-md); padding:18px; cursor:pointer; transition:border-color .2s; }
  .pay-option.selected{ border-color:var(--gold); background:#FCF6E4; }
  .pay-option b{ display:block; margin-bottom:4px; }
  .pay-option span{ font-size:.8rem; color:var(--ink-soft); }
  .mini-item{ display:flex; justify-content:space-between; font-size:.86rem; margin-bottom:10px; color:var(--ink-soft); }
  .mini-item b{ color:var(--ink); }
  @media (max-width:900px){ .checkout-layout{ grid-template-columns:1fr; } .pay-options{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand-mark"><span class="dot"></span> AgroFlow</a>
    <ul class="nav-links"><li><a href="products.html">Continue Shopping</a></li></ul>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn" aria-label="Cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="1.7"/></svg><span class="cart-count">0</span></a>
    </div>
  </div>
</nav>

<header class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / Checkout</div>
    <h1 style="font-size:2.2rem;">Checkout</h1>
  </div>
</header>

<section class="section tight">
  <div class="container">
    <div class="checkout-layout">
      <form class="form-card" id="checkout-form">
        <h3>Delivery Details</h3>
        <div class="form-grid" style="margin-top:18px;">
          <div class="field"><label>Full Name *</label><input type="text" id="c-name" required></div>
          <div class="field"><label>Phone Number *</label><input type="tel" id="c-phone" pattern="[0-9]{10}" required placeholder="10-digit mobile"></div>
          <div class="field full"><label>Email (optional)</label><input type="email" id="c-email"></div>
          <div class="field full"><label>Address *</label><textarea id="c-address" required placeholder="House no, street, locality"></textarea></div>
          <div class="field"><label>City *</label><input type="text" id="c-city" required></div>
          <div class="field"><label>State *</label><input type="text" id="c-state" required></div>
          <div class="field"><label>Pincode *</label><input type="text" pattern="[0-9]{6}" id="c-pincode" required></div>
        </div>

        <h3 style="margin-top:30px;">Payment Method</h3>
        <div class="pay-options">
          <div class="pay-option selected" data-method="cod" onclick="selectPayment('cod')">
            <b>Cash on Delivery</b><span>Pay when your order arrives</span>
          </div>
          <div class="pay-option" data-method="razorpay" onclick="selectPayment('razorpay')">
            <b>Pay Online</b><span>UPI, Card, Netbanking via Razorpay</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">Place Order</button>
      </form>

      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="mini-items" style="margin:18px 0;"></div>
        <div class="summary-row"><span>Subtotal</span><span id="co-subtotal">₹0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="co-shipping">₹0</span></div>
        <div class="summary-row total"><span>Total</span><span id="co-total">₹0</span></div>
      </div>
    </div>
  </div>
</section>

<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 AgroFlow. All rights reserved.</span></div></div></footer>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
