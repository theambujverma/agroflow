<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — AgroFlow Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><span class="dot"></span> AgroFlow Admin</div>
    <nav class="admin-nav" id="admin-nav"></nav>
    <div class="admin-logout"><button id="logout-btn">Log out</button></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Products</h1>
      <div class="notif-bell"><span>🔔</span><span class="notif-dot" id="notif-dot"></span></div>
    </div>

    <div class="admin-content">
      <div class="admin-card">
        <div class="toolbar">
          <input type="text" class="search-input" id="search-input" placeholder="Search products…">
          <a href="product-edit.html" class="btn btn-primary btn-sm">+ Add Product</a>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th></th><th>Name</th><th>Brand</th><th>Price</th><th>Stock</th><th>Status</th><th>Featured</th><th></th></tr></thead>
            <tbody id="products-body"><tr><td colspan="8">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="js/admin-common.js"></script>
<script>
let allProducts = [];

function renderRows(list){
  const body = document.getElementById('products-body');
  if (!list.length){ body.innerHTML = `<tr><td colspan="8">No products found.</td></tr>`; return; }
  body.innerHTML = list.map(p => `
    <tr>
      <td><img class="row-thumb" src="${p.image_url || 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?q=80&w=200&auto=format&fit=crop'}"></td>
      <td><b>${p.name}</b><br><span class="hint">${p.size_ml} ml</span></td>
      <td>${p.brands ? p.brands.name : '—'}</td>
      <td>₹${Number(p.price).toLocaleString('en-IN')}</td>
      <td>${p.stock_qty}</td>
      <td>
        <select class="status-select" onchange="toggleAvailability('${p.id}', this.value)">
          <option value="true" ${p.is_available ? 'selected':''}>Available</option>
          <option value="false" ${!p.is_available ? 'selected':''}>Hidden</option>
        </select>
      </td>
      <td>
        <select class="status-select" onchange="toggleFeatured('${p.id}', this.value)">
          <option value="true" ${p.is_featured ? 'selected':''}>Featured</option>
          <option value="false" ${!p.is_featured ? 'selected':''}>Normal</option>
        </select>
      </td>
      <td>
        <div class="action-row">
          <a class="icon-btn-sm" href="product-edit.html?id=${p.id}" title="Edit">✏️</a>
          <button class="icon-btn-sm" title="Delete" onclick="deleteProduct('${p.id}', '${p.name.replace(/'/g,"\\'")}')">🗑️</button>
        </div>
      </td>
    </tr>
  `).join('');
}

async function loadProducts(){
  const { data, error } = await supabaseClient.from('products').select('*, brands(name)').order('created_at', { ascending:false });
  if (error){ console.error(error); return; }
  allProducts = data || [];
  renderRows(allProducts);
}

async function toggleAvailability(id, value){
  await supabaseClient.from('products').update({ is_available: value === 'true' }).eq('id', id);
  showToast('Product updated', 'success');
}
async function toggleFeatured(id, value){
  await supabaseClient.from('products').update({ is_featured: value === 'true' }).eq('id', id);
  showToast('Product updated', 'success');
}
async function deleteProduct(id, name){
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  const { error } = await supabaseClient.from('products').delete().eq('id', id);
  if (error){ showToast('Could not delete product', 'error'); return; }
  showToast('Product deleted', 'success');
  loadProducts();
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  renderRows(allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.brands && p.brands.name.toLowerCase().includes(q))));
});

(async function(){
  const ctx = await requireAdmin();
  if (!ctx) return;
  renderSidebar('products');
  initAdminLogout();
  initAdminRealtime();
  refreshAdminCounts();
  loadProducts();
})();
</script>
</body>
</html>
