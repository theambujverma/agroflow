<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — AgroFlow Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><span class="dot"></span> AgroFlow Admin</div>
    <nav class="admin-nav" id="admin-nav"></nav>
    <div class="admin-logout"><button id="logout-btn">Log out</button></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Leads</h1>
      <div class="notif-bell"><span>🔔</span><span class="notif-dot" id="notif-dot"></span></div>
    </div>

    <div class="admin-content">
      <div class="admin-card">
        <div class="toolbar">
          <input type="text" class="search-input" id="search-input" placeholder="Search leads…">
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Message</th><th>Received</th><th></th></tr></thead>
            <tbody id="leads-body"><tr><td colspan="6">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="js/admin-common.js"></script>
<script>
let allLeads = [];

function renderLeads(list){
  const body = document.getElementById('leads-body');
  body.innerHTML = list.length ? list.map(l => `
    <tr style="${l.is_read ? '' : 'font-weight:700;'}">
      <td>${l.is_read ? '' : '🟢 '} ${l.name}</td>
      <td><a href="tel:${l.phone}">${l.phone}</a></td>
      <td>${l.email || '—'}</td>
      <td style="max-width:320px;">${l.message || ''}</td>
      <td class="hint">${formatDate(l.created_at)}</td>
      <td>
        <div class="action-row">
          <a class="icon-btn-sm" href="https://wa.me/91${l.phone}" target="_blank" title="WhatsApp">💬</a>
          ${!l.is_read ? `<button class="icon-btn-sm" onclick="markRead('${l.id}')" title="Mark read">✔️</button>` : ''}
          <button class="icon-btn-sm" onclick="deleteLead('${l.id}')" title="Delete">🗑️</button>
        </div>
      </td>
    </tr>
  `).join('') : `<tr><td colspan="6">No leads yet.</td></tr>`;
}

async function markRead(id){
  await supabaseClient.from('leads').update({ is_read:true }).eq('id', id);
  loadLeads();
  refreshAdminCounts();
}
async function deleteLead(id){
  if (!confirm('Delete this lead?')) return;
  await supabaseClient.from('leads').delete().eq('id', id);
  loadLeads();
  refreshAdminCounts();
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  renderLeads(allLeads.filter(l => l.name.toLowerCase().includes(q) || l.phone.includes(q)));
});

async function loadLeads(){
  const { data, error } = await supabaseClient.from('leads').select('*').order('created_at', { ascending:false });
  if (error){ console.error(error); return; }
  allLeads = data || [];
  renderLeads(allLeads);
}

(async function(){
  const ctx = await requireAdmin();
  if (!ctx) return;
  renderSidebar('leads');
  initAdminLogout();
  initAdminRealtime();
  refreshAdminCounts();
  loadLeads();

  supabaseClient.channel('leads-live-refresh')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'leads' }, loadLeads)
    .subscribe();
})();
</script>
</body>
</html>
